name: Build legacy Win32 json-glib DLL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  win32:
    name: Win32 json-glib compatibility preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./setup-win32
      - name: Check GLib compatibility and prepare DLL build
        run: bash dependencies/json-glib/build-win32.sh
