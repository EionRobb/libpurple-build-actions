name: Build legacy Win32 json-glib DLL
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'dependencies/json-glib/**'
      - '.github/workflows/build-json-glib.yml'
permissions:
  contents: read
jobs:
  win32:
    name: Build json-glib 0.14.2 (i686)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install legacy Autotools cross-build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends autoconf automake libtool gettext autopoint pkg-config xz-utils
      - uses: ./setup-win32
      - name: Build DLL against historical Pidgin GLib SDK
        run: bash dependencies/json-glib/build-win32.sh
      - name: Inspect Windows binary and dependencies
        run: |
          find dist/json-glib-win32 -type f | sort
          dll=$(find dist/json-glib-win32 -type f -iname '*json-glib*.dll' -print -quit)
          test -n "$dll"
          file "$dll"
          i686-w64-mingw32-objdump -p "$dll" | grep 'DLL Name:'
      - name: Upload build output for review
        uses: actions/upload-artifact@v4
        with:
          name: json-glib-0.14.2-win32-unverified
          path: dist/json-glib-win32/
