name: Setup osxcross
description: Build/cache LLVM osxcross with a pinned default SDK; callers may override SDK source and checksum
inputs:
  sdk-url:
    description: HTTPS URL of a macOS SDK archive (override optional; ensure you have appropriate rights)
    required: false
    default: 'https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz'
  sdk-sha256:
    description: Expected SHA-256 of the SDK archive (override alongside sdk-url)
    required: false
    default: 'cd4f08a75577145b8f05245a2975f7c81401d75e9535dcffbb879ee1deefcbf4'
  osxcross-commit:
    description: Pinned upstream osxcross commit
    required: false
    default: '27d21e4977c9751d01199c7a226a6faf494c3dd9'
runs:
  using: composite
  steps:
    - name: Install compiler prerequisites
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang cmake make patch xz-utils bzip2 cpio libxml2-dev libssl-dev zlib1g-dev liblzma-dev libbz2-dev llvm-dev lld uuid-dev p7zip-full pkg-config
    - name: Expose versioned LLVM Mach-O linker
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v ld64.lld >/dev/null 2>&1; then
          linker="$(find /usr/bin /usr/lib/llvm-*/bin -maxdepth 1 -name 'ld64.lld*' -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$linker" ]]; then
            echo '::error::LLVM lld package installed but no ld64.lld executable found'
            exit 1
          fi
          sudo ln -s "$linker" /usr/local/bin/ld64.lld
        fi
        ld64.lld --version
    - name: Restore toolchain cache
      id: toolchain
      uses: actions/cache@v4
      with:
        path: /opt/osxcross
        key: osxcross-llvm-ubuntu24-${{ runner.arch }}-${{ inputs.osxcross-commit }}-${{ inputs.sdk-sha256 }}-v2
    - name: Build osxcross
      if: steps.toolchain.outputs.cache-hit != 'true'
      shell: bash
      env:
        SDK_URL: ${{ inputs.sdk-url }}
        SDK_SHA256: ${{ inputs.sdk-sha256 }}
        OSXCROSS_COMMIT: ${{ inputs.osxcross-commit }}
      run: bash "$GITHUB_ACTION_PATH/scripts/build.sh"
    - name: Verify host linker dependencies
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$(. /etc/os-release; echo "$VERSION_ID")" != "24.04" ]]; then
          echo '::error::setup-osxcross currently requires Ubuntu 24.04 for a stable linker ABI'
          exit 1
        fi
        # osxcross compiler commands are wrappers/symlinks, not necessarily ELF binaries.
        # Exercise the actual compiler/linker instead of running ldd on wrappers.
        for arch in x86_64 arm64; do
          compiler="$(find /opt/osxcross/bin -maxdepth 1 -name "${arch}-apple-darwin*-clang" -print -quit)"
          [[ -n "$compiler" && -x "$compiler" ]] || { echo "::error::Missing $arch compiler"; exit 1; }
          "$compiler" --version >/dev/null
          printf 'int main(void) { return 0; }\n' | "$compiler" -x c - -o "$RUNNER_TEMP/osxcross-smoke-$arch"
          file "$RUNNER_TEMP/osxcross-smoke-$arch" | grep -q 'Mach-O' || { echo "::error::Not a Mach-O binary for $arch"; exit 1; }
        done
        command -v ld64.lld >/dev/null || { echo '::error::LLVM Mach-O linker unavailable'; exit 1; }
    - name: Export toolchain paths
      shell: bash
      run: |
        echo "OSXCROSS=/opt/osxcross" >> "$GITHUB_ENV"
        echo "/opt/osxcross/bin" >> "$GITHUB_PATH"
        compiler="$(find /opt/osxcross/bin -maxdepth 1 -name 'x86_64-apple-darwin*-clang' -print -quit)"
        test -n "$compiler"
        target="$(basename "$compiler" | sed 's/^x86_64-apple-//;s/-clang$//')"
        echo "DARWIN_TARGET=$target" >> "$GITHUB_ENV"
